<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">

  <!-- Rounded square dark navy background -->
  <rect width="100" height="100" rx="18" fill="#123A7A"/>

  <!-- ECG + Heart Icon, centered in the square -->
  <g transform="translate(7, 20)">

    <!-- ECG Line left of heart -->
    <polyline
      points="0,40 10,40 15,40 20,18 26,62 31,26 36,40 42,40"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Heart shape centered at ~57,38 -->
    <path
      d="M57,34
         C57,25 46,20 41,27
         C37,33 39,38 43,43
         L57,57
         L71,43
         C75,38 77,33 73,27
         C68,20 57,25 57,34 Z"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- ECG line crossing through heart horizontally -->
    <line
      x1="42" y1="40"
      x2="72" y2="40"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
    />

    <!-- ECG continues right of heart -->
    <polyline
      points="72,40 78,40 86,40"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

  </g>

</svg>
